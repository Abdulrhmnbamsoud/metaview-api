# render.yaml - Render Blueprint for MetaView 3
services:
  # ---------- Backend: FastAPI + SQLite on a persistent disk ----------
  - type: web
    name: metaview-backend
    runtime: python
    plan: starter
    region: oregon
    branch: render-deploy
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: DATA_DIR
        value: /var/app/data
      - key: CORS_ORIGINS
        value: https://metaview-frontend.onrender.com
      - key: CORS_ORIGIN_REGEX
        value: ^https://metaview-frontend(-[a-z0-9]+)?\.onrender\.com$
      - key: AUTO_INGEST
        value: "true"
      - key: SAUDI_AUTO_INGEST
        value: "true"
      - key: SAUDI_INGEST_EVERY_HOURS
        value: "6"
      - key: ADMIN_TOKEN   # protects POST /saudi-fraud/ingest/run; set the value in the Render dashboard
        sync: false
      - key: INITIAL_ADMIN_EMAIL   # optional: custom email for first admin
        sync: false
      - key: INITIAL_ADMIN_PASSWORD # optional: custom password for first admin
        sync: false
    disk:
      name: metaview-data
      mountPath: /var/app/data
      sizeGB: 1

  # ---------- Frontend: React + Vite static site ----------
  - type: web
    name: metaview-frontend
    runtime: static
    branch: render-deploy
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://metaview-backend.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
