# render.yaml - Render Blueprint for MetaView 3
services:
  # ---------- Backend: FastAPI + SQLite on a persistent disk ----------
  - type: web
    name: metaview-api
    runtime: python
    plan: starter
    region: oregon
    branch: render-deploy
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/app/data
      - key: CORS_ORIGINS
        value: https://metaview-frontend.onrender.com
      - key: AUTO_INGEST
        value: "true"
    disk:
      name: metaview-data
      mountPath: /var/app/data
      sizeGB: 1

  # ---------- Frontend: React + Vite static site ----------
  - type: web
    name: metaview-frontend
    runtime: static
    branch: render-deploy
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://metaview-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
